version: 1
pipeline:
  clone:
    depth: 1
    ref:
      name: <+inputs.branch>
      type: branch
    repo: <+inputs.repo>
    connector: <+inputs.gitConnector>

  stages:
    - name: security-scan
      steps:
        - name: vulnerability_scanner
          run:
            container:
              image: <+inputs.scannerImage>
            with:
              scan_type: "full"
              severity_threshold: "medium"
              output_file: /harness/security/findings.json
              working_directory: /harness
              repo: <+inputs.repo>
              branch: <+inputs.branch>
            env:
              ANTHROPIC_API_KEY: <+inputs.llmConnector.token>

        - name: generate_report
          run:
            container:
              image: <+inputs.reportImage>
            with:
              findings_file: /harness/security/findings.json
              report_file: /harness/security/SECURITY_REPORT.md
              format: markdown

        - name: post_findings
          run:
            container:
              image: <+inputs.commentImage>
            with:
              report_file: /harness/security/SECURITY_REPORT.md
              repo: <+inputs.repo>
              pr_number: <+inputs.pullReq>
            env:
              TOKEN: <+inputs.harnessKey>
          if: <+inputs.pullReq> != ""

      platform:
        os: linux
        arch: <+inputs.arch>

  inputs:
    llmConnector:
      type: connector
      required: true
      description: Anthropic-compatible LLM connector (token mapped to ANTHROPIC_API_KEY)
    gitConnector:
      type: connector
      required: true
      description: Git repository connector
    harnessKey:
      type: secret
      default: account.harness_api_key
      description: API key used to post PR findings comments
    repo:
      type: string
      required: true
      description: Repository identifier (org/repo)
    branch:
      type: string
      default: main
      description: Branch to scan
    pullReq:
      type: string
      default: ""
      description: Pull request number (optional, for PR comments)
    arch:
      type: string
      default: amd64
      description: Pipeline platform architecture (amd64 or arm64)
    scannerImage:
      type: string
      default: myregistry/security-scanner:1.0.0
      description: Container image for vulnerability scanning (replace with your registry)
    reportImage:
      type: string
      default: myregistry/report-generator:1.0.0
      description: Container image for report generation (replace with your registry)
    commentImage:
      type: string
      default: myregistry/pr-comment:1.0.0
      description: Container image for posting PR comments (replace with your registry)
